              instance_type:
                type: string
                description: Dedicated node instance type (e.g. devlyft-amd-balanced-2). Required when the deploy is DEDICATED; INHERIT deploys inherit the environment's.
              replicas:
                type: integer
                format: uint32
                description: Number of replicas
              expose:
                type: boolean
                description: Publicly route this deploy via edge ingress (requires the build to declare a container_port)
              enable_hpa:
                type: boolean
                description: Whether HPA is enabled
              hpa_min_replicas:
                type: integer
                format: uint32
                nullable: true
                description: Minimum replicas for HPA
              hpa_max_replicas:
                type: integer
                format: uint32
                nullable: true
                description: Maximum replicas for HPA
              hpa_target_cpu:
                type: integer
                format: uint32
                nullable: true
                description: Target CPU percentage for HPA
              registry_credential_name:
                type: string
                description: Name of a registry credential saved in the deploy's environment, used to pull a private image. Omit to keep the deploy's current credential; detach one with DELETE /v1/deploys/{deploy_id}/registry-credential.
            required:
              - build_id
