components:
  schemas:
    DeployPlacementState:
      type: string
      enum:
        - PLACED
        - PENDING
      description: >-
        Whether the deploy has been assigned to an edge cluster. PENDING means no cluster in the deploy's location can currently take it, most often because the cluster its environment occupies is full or is being drained. A deploy stays PENDING until capacity frees up; it is retried automatically and needs no action to resume.
    DeployPlacement:
      type: object
      description: >-
        Where the deploy is running. All deploys of one environment in one location share a cluster, so this is a property of the environment's placement as much as the deploy's.
      properties:
        state:
          $ref: '#/components/schemas/DeployPlacementState'
        cluster_name:
          type: string
          description: The name of the edge cluster serving this deploy. Absent while state is PENDING.
      required:
        - state
    TenancyType:
      type: string
      enum:
        - INHERIT
        - SHARED
        - DEDICATED
      description: >-
        Type of tenancy for the deploy. INHERIT follows the environment's tenancy policy; SHARED forces the global shared pool; DEDICATED leases nodes to this deploy exclusively.
    DeployEnvVar:
      type: object
      description: Environment variable with a plain value.
      required:
        - kind
        - key
        - value
      properties:
        kind:
          type: string
          enum:
            - env
          description: Identifies this entry as an env var
        key:
          type: string
          description: Variable name
        value:
          type: string
          description: Plain value
    DeploySecretRef:
      type: object
      description: Reference to an environment secret by key; the variable takes the secret's value.
      required:
        - kind
        - key
      properties:
        kind:
          type: string
          enum:
            - secret
          description: Identifies this entry as a secret ref
        key:
          type: string
          description: Secret key name
    DeployEnvItem:
      description: One env entry — user specifies kind (env or secret) to indicate plain value vs secret ref.
      oneOf:
        - $ref: '#/components/schemas/DeployEnvVar'
        - $ref: '#/components/schemas/DeploySecretRef'
      discriminator:
        propertyName: kind
    Build:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the build
        project_id:
          type: string
          format: uuid
          description: UUID of the parent project
        name:
          type: string
          description: Name of the build
        image:
          type: string
          description: Container image for the build
        tag:
          type: string
          description: Tag for the build
        cpu_request:
          type: string
          description: CPU request (e.g., "100m", "1")
        memory_request:
          type: string
          description: Memory request (e.g., "128Mi", "1Gi")
        container_port:
          type: integer
          nullable: true
          minimum: 1
          maximum: 65535
          description: Port the container listens on; required to expose a deploy built from this build
        created_at:
          type: string
          format: date-time
          description: Timestamp when the build was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the build was last updated
      required:
        - id
        - project_id
        - name
        - image
        - tag
        - created_at
        - updated_at
        - cpu_request
        - memory_request
    Deploy:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the deploy
        environment_id:
          type: string
          format: uuid
          description: UUID of the parent environment
        build_id:
          type: string
          format: uuid
          description: UUID of the build used by this deploy
        name:
          type: string
          description: Name of the deploy
        location_id:
          type: string
          description: Location ID where the deploy is deployed
        env:
          type: array
          items:
            $ref: '#/components/schemas/DeployEnvItem'
          nullable: true
          description: Env entries (plain vars or secret refs).
        tenancy_type:
          $ref: '#/components/schemas/TenancyType'
        instance_type:
          type: string
          description: Dedicated node instance type (present when the deploy pins one).
        replicas:
          type: integer
          format: uint32
          description: Number of replicas
        expose:
          type: boolean
          description: Whether the deploy is publicly routed via edge ingress
        enable_hpa:
          type: boolean
          description: Whether HPA is enabled
        hpa_min_replicas:
          type: integer
          format: uint32
          nullable: true
          description: Minimum replicas for HPA
        hpa_max_replicas:
          type: integer
          format: uint32
          nullable: true
          description: Maximum replicas for HPA
        hpa_target_cpu:
          type: integer
          format: uint32
          nullable: true
          description: Target CPU percentage for HPA
        placement:
          $ref: '#/components/schemas/DeployPlacement'
        has_registry_credential:
          type: boolean
          description: Whether a private container registry pull credential is set for this deploy's image. The credential value itself is never returned.
        registry_credential_name:
          type: string
          nullable: true
          description: Name of the saved registry credential this deploy uses. Null when it has none.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the deploy was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the deploy was last updated
      required:
        - id
        - environment_id
        - build_id
        - name
        - location_id
        - tenancy_type
        - replicas
        - expose
        - enable_hpa
        - placement
        - has_registry_credential
        - created_at
        - updated_at
    ListBuildsResponse:
      type: object
      properties:
        builds:
          type: array
          items:
            $ref: '#/components/schemas/Build'
      required:
        - builds
    ListDeploysResponse:
      type: object
      properties:
        deploys:
          type: array
          items:
            $ref: '#/components/schemas/Deploy'
      required:
        - deploys
    CustomDomain:
      type: object
      description: A customer-owned domain and its ownership-verification state.
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the custom domain
        organization_id:
          type: string
          format: uuid
          description: UUID of the owning organization
        domain:
          type: string
          description: The owned domain; verification covers it and all of its subdomains
        status:
          type: string
          enum:
            - pending
            - verified
            - active
            - failed
            - revoked
          description: Ownership-verification state
        verification_token:
          type: string
          description: Value to publish in the TXT challenge record
        challenge_record_name:
          type: string
          description: DNS name to create a TXT record at (its value must equal verification_token)
        verified_at:
          type: string
          format: date-time
          nullable: true
          description: When ownership was first verified
        last_checked_at:
          type: string
          format: date-time
          nullable: true
          description: When verification was last attempted
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - organization_id
        - domain
        - status
        - verification_token
        - challenge_record_name
        - created_at
        - updated_at
    ListCustomDomainsResponse:
      type: object
      properties:
        domains:
          type: array
          items:
            $ref: '#/components/schemas/CustomDomain'
      required:
        - domains
    Route:
      type: object
      description: A hostname (optionally scoped to a path prefix) routed to a deploy.
      properties:
        id:
          type: string
          format: uuid
        deploy_id:
          type: string
          format: uuid
        hostname:
          type: string
        path_prefix:
          type: string
        cname_target:
          type: string
          description: >-
            The name to point this hostname's CNAME at. It is derived from the hostname and never changes for the life of the route, including when the deploy moves between edge clusters — which is the point: the customer publishes this once and never edits their DNS again. Absent when the deployment publishes no edge DNS.
          example: d0c43d3885064d9a.edge.devlyft.io
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - deploy_id
        - hostname
        - path_prefix
        - created_at
        - updated_at
    ListRoutesResponse:
      type: object
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
      required:
        - routes
  requestBodies:
    CreateRouteRequest:
      description: Request body for attaching a route to a deploy
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              hostname:
                type: string
                description: Hostname to route; must be covered by an org-verified domain
              path_prefix:
                type: string
                description: Optional path prefix (e.g. /v1/one); omit or "/" for the whole host
            required:
              - hostname
    CreateCustomDomainRequest:
      description: Request body for claiming a custom domain
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              domain:
                type: string
                description: >-
                  The domain the organization owns and can prove control of, e.g. "devlyft.io". Ownership is verified once (via a TXT record at _devlyft-challenge.<domain>) and covers this domain and all of its subdomains, which may then be routed to deploys.
            required:
              - domain
    CreateBuildRequest:
      description: Request body for creating a new build
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Name of the build
              image:
                type: string
                description: Container image for the build
              tag:
                type: string
                description: Tag for the build
              cpu_request:
                type: string
                description: CPU request (e.g., "100m", "1")
              memory_request:
                type: string
                description: Memory request (e.g., "128Mi", "1Gi")
              container_port:
                type: integer
                nullable: true
                minimum: 1
                maximum: 65535
                description: Port the container listens on; required to expose a deploy built from this build
            required:
              - name
              - image
              - tag
              - cpu_request
              - memory_request
    CreateDeployRequest:
      description: Request body for creating a new deploy (environment is in the path).
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              build_id:
                type: string
                format: uuid
                description: UUID of the build to use
              name:
                type: string
                description: Name of the deploy
              location_id:
                type: string
                description: Location ID where the deploy is deployed
              env:
                type: array
                items:
                  $ref: '#/components/schemas/DeployEnvItem'
                nullable: true
                description: Env entries (plain vars or secret refs)
              tenancy_type:
                $ref: '#/components/schemas/TenancyType'
              instance_type:
                type: string
                description: Dedicated node instance type (e.g. devlyft-amd-balanced-2). Required when the deploy is DEDICATED; INHERIT deploys inherit the environment's.
              replicas:
                type: integer
                format: uint32
                description: Number of replicas
              expose:
                type: boolean
                description: Publicly route this deploy via edge ingress (requires the build to declare a container_port)
              enable_hpa:
                type: boolean
                description: Whether HPA is enabled
              hpa_min_replicas:
                type: integer
                format: uint32
                nullable: true
                description: Minimum replicas for HPA
              hpa_max_replicas:
                type: integer
                format: uint32
                nullable: true
                description: Maximum replicas for HPA
              hpa_target_cpu:
                type: integer
                format: uint32
                nullable: true
                description: Target CPU percentage for HPA
              registry_credential_name:
                type: string
                description: Name of a registry credential saved in the deploy's environment, used to pull a private image. Omit for a public image.
            required:
              - build_id
              - name
              - location_id
              - replicas
              - enable_hpa
    UpdateDeployRequest:
      description: Request body for updating a deploy
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              build_id:
                type: string
                format: uuid
                description: UUID of the build to use
              name:
                type: string
                description: Name of the deploy
              location_id:
                type: string
                description: Location ID where the deploy is deployed
              env:
                type: array
