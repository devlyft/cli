version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      gomod:
        patterns: ["*"]
    ignore:
      # Code generation must match the platform: these move together with
      # its oapi-codegen version, not on their own.
      - dependency-name: github.com/oapi-codegen/*
      - dependency-name: github.com/getkin/kin-openapi
      - dependency-name: github.com/oasdiff/*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
