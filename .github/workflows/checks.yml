name: checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows too; make is not installed there, so call go directly.
        shell: bash
    env:
      BIN: bin/devlyft${{ matrix.os == 'windows-latest' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go build -trimpath -o "$BIN" ./cmd/devlyft
      - run: '"./$BIN" version'
      - name: Completion scripts generate
        run: |
          for shell in bash zsh fish powershell; do
            "./$BIN" completion "$shell" > /dev/null
          done

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...

  # Builds every release target without signing or publishing, so changes to
  # .goreleaser.yaml are caught before a tag is pushed.
  release-snapshot:
    name: release-snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom
      - name: shellcheck install.sh
        run: shellcheck --shell=sh install.sh
      - name: install.sh installs the snapshot
        run: |
          version=$(jq -r .version dist/metadata.json)
          DEVLYFT_DOWNLOAD_BASE="file://$PWD/dist" DEVLYFT_VERSION="$version" \
            DEVLYFT_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/devlyft" version | grep -F "devlyft $version"
      - name: install.sh rejects a tampered archive
        run: |
          version=$(jq -r .version dist/metadata.json)
          bad="$RUNNER_TEMP/tampered"
          mkdir -p "$bad"
          cp dist/devlyft_"$version"_* "$bad"/
          cp "dist/devlyft_${version}_linux_arm64.tar.gz" "$bad/devlyft_${version}_linux_amd64.tar.gz"
          if DEVLYFT_DOWNLOAD_BASE="file://$bad" DEVLYFT_VERSION="$version" \
            DEVLYFT_INSTALL_DIR="$RUNNER_TEMP/bad-bin" sh install.sh; then
            echo "install.sh accepted a tampered archive" >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/bad-bin/devlyft"
      - name: deb package installs
        run: |
          version=$(jq -r .version dist/metadata.json)
          sudo dpkg -i "dist/devlyft_${version}_linux_amd64.deb"
          devlyft version | grep -F "devlyft $version"
          sudo dpkg -r devlyft
      - name: rpm package installs
        run: |
          version=$(jq -r .version dist/metadata.json)
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest sh -c \
            "rpm -i /dist/devlyft_${version}_linux_amd64.rpm && devlyft version | grep -F 'devlyft $version'"
      - name: Scoop manifest is valid JSON with both architectures
        run: jq -e '.architecture["64bit"].hash and .architecture.arm64.hash' dist/scoop/bucket/devlyft.json
