# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: devlyft

before:
  hooks:
    - go mod verify

builds:
  - id: devlyft
    main: ./cmd/devlyft
    binary: devlyft
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/devlyft/cli/internal/version.Version={{ .Version }}
      - -X github.com/devlyft/cli/internal/version.Commit={{ .FullCommit }}
      - -X github.com/devlyft/cli/internal/version.Date={{ .CommitDate }}
    # Reproducible builds: file timestamps come from the commit, not the clock.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: devlyft
    ids: [devlyft]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# One SBOM per archive, generated by syft.
sboms:
  - artifacts: archive

# Keyless signing of the checksum file with the release workflow's GitHub
# OIDC identity. The checksum file covers every archive and SBOM, so one
# signature covers the whole release.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "--bundle=${artifact}.sigstore.json"
      - "${artifact}"
      - "--yes"
    output: true

# release-please writes the changelog and the release notes.
changelog:
  disable: true

release:
  github:
    owner: devlyft
    name: cli
  # release-please has already created the release; goreleaser only attaches
  # the artifacts and keeps its notes.
  mode: keep-existing
  prerelease: auto

snapshot:
  version_template: "{{ incpatch .Version }}-next"
