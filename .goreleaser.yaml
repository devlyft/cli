# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: devlyft

before:
  hooks:
    - go mod verify

builds:
  - id: devlyft
    main: ./cmd/devlyft
    binary: devlyft
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/devlyft/cli/internal/version.Version={{ .Version }}
      - -X github.com/devlyft/cli/internal/version.Commit={{ .FullCommit }}
      - -X github.com/devlyft/cli/internal/version.Date={{ .CommitDate }}
    # Reproducible builds: file timestamps come from the commit, not the clock.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: devlyft
    ids: [devlyft]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# One SBOM per archive, generated by syft.
sboms:
  - artifacts: archive

# Keyless signing of the checksum file with the release workflow's GitHub
# OIDC identity. The checksum file covers every archive and SBOM, so one
# signature covers the whole release.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "--bundle=${artifact}.sigstore.json"
      - "${artifact}"
      - "--yes"
    output: true

# Homebrew: `brew install devlyft/tap/devlyft`. Casks replace the deprecated
# `brews` formulae. The cask is pushed to devlyft/homebrew-tap with a token
# scoped to that repository only; without the token (for example before the
# tap exists) the upload is skipped instead of failing the release.
homebrew_casks:
  - name: devlyft
    ids: [devlyft]
    binaries: [devlyft]
    description: Deploy and operate apps on DevLyft
    homepage: https://github.com/devlyft/cli
    license: Apache-2.0
    repository:
      owner: devlyft
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}'
    directory: Casks
    commit_author:
      name: devlyft-release-bot
      email: noreply@devlyft.io
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    skip_upload: '{{ if not (envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "") }}true{{ end }}'
    # Runs `devlyft completion <shell>` at install time.
    generate_completions_from_executable:
      executable: devlyft
      args: [completion]
      shells: [bash, zsh, fish]
    hooks:
      post:
        # The binaries are not notarized (see docs/releasing.md); without
        # this, Gatekeeper refuses to run a cask-installed binary.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/devlyft"]
          end

# Linux packages, attached to the GitHub release and covered by the signed
# checksum file.
nfpms:
  - id: devlyft
    ids: [devlyft]
    package_name: devlyft
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [deb, rpm]
    vendor: DevLyft
    homepage: https://github.com/devlyft/cli
    maintainer: DevLyft <noreply@devlyft.io>
    description: The official command-line interface for DevLyft.
    license: Apache-2.0
    section: devel
    bindir: /usr/bin
    # Reproducible packages: timestamps come from the commit, not the clock.
    mtime: "{{ .CommitDate }}"
    contents:
      - src: LICENSE
        dst: /usr/share/doc/devlyft/LICENSE
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/devlyft/README.md
        file_info:
          mode: 0644
    rpm:
      group: Development/Tools

# Scoop: `scoop bucket add devlyft https://github.com/devlyft/scoop-bucket`
# then `scoop install devlyft`. The manifest is pushed with a token scoped to
# that repository only; without the token the upload is skipped instead of
# failing the release.
scoops:
  - name: devlyft
    ids: [devlyft]
    description: The official command-line interface for DevLyft.
    homepage: https://github.com/devlyft/cli
    license: Apache-2.0
    repository:
      owner: devlyft
      name: scoop-bucket
      token: '{{ envOrDefault "SCOOP_BUCKET_GITHUB_TOKEN" "" }}'
    directory: bucket
    commit_author:
      name: devlyft-release-bot
      email: noreply@devlyft.io
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
    skip_upload: '{{ if not (envOrDefault "SCOOP_BUCKET_GITHUB_TOKEN" "") }}true{{ end }}'

# release-please writes the changelog and the release notes.
changelog:
  disable: true

release:
  github:
    owner: devlyft
    name: cli
  # release-please has already created the release; goreleaser only attaches
  # the artifacts and keeps its notes.
  mode: keep-existing
  prerelease: auto

snapshot:
  version_template: "{{ incpatch .Version }}-next"
